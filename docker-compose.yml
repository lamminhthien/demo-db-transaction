version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: demo-db-transaction-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-demo_tx}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-demo_tx}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
